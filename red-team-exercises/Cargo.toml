[package]
name = "red-team-exercises"
version = "0.1.0"
edition = "2021"
description = "Red team security testing exercises and attack simulations"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
url = { workspace = true }
redis = { workspace = true }
prometheus = { workspace = true }
hyper = { workspace = true }
urlencoding = { workspace = true }
async-trait = { workspace = true }
pprof = { workspace = true, optional = true }
criterion = { workspace = true, optional = true }
# Non-workspace dependencies
clap = { version = "4.5.45", features = ["derive"] }
futures = "0.3.31"
pem = "3.0.5"
x509-parser = "0.17.0"
pretty_assertions = "1.4.1"
colored = "2.0.0"
indicatif = "0.17.1"
tabular = "0.2.0"
hex = "0.4.3"
thiserror = "2.0"
# Integration dependencies
config = "0.15.14"
toml = "0.8.0"
xml-rs = "0.8.26"
elasticsearch = "9.1.0-alpha.1"
serde-xml-rs = "0.8.1"
kafka = "0.9"
rdkafka = "0.38.0"
aws-sdk-s3 = "1.103.0"
aws-config = "1.8.4"
aws-sdk-sqs = "1.0.0"
slack-morphism = "2.14.0"
teloxide = "0.17.0"
webhook = "2.1.2"
ring = "0.17.0"
# Common utilities (optional)
# common = { path = "../common", optional = true }

[features]
default = []
benchmarks = ["criterion", "pprof"]
