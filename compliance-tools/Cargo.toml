[package]
name = "compliance-tools"
version = "0.1.0"
edition = "2021"
description = "Rust-based compliance reporting and validation tools"
authors = ["Rust Security Team"]
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "compliance-report-generator"
path = "src/bin/compliance_report_generator.rs"

[[bin]]
name = "threat-feed-validator"
path = "src/bin/threat_feed_validator.rs"

[[bin]]
name = "sbom-generator"
path = "src/bin/sbom_generator.rs"


[dependencies]
# Core dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# HTTP and API clients
reqwest = { workspace = true }
url = { workspace = true }

# Template engine for reports
tera = { workspace = true }
handlebars = { workspace = true }

# Configuration and environment
dotenvy = { workspace = true }

# Prometheus metrics
prometheus = { workspace = true }

# File system operations
walkdir = { workspace = true }
tempfile = { workspace = true }

# Cryptography
sha2 = { workspace = true }

# Date/time parsing
regex = { workspace = true }

# Redis for caching
redis = { workspace = true, optional = true }

# Common utilities
common = { path = "../common" }

# Non-workspace dependencies
serde_yml = "1.0.0"
clap = { version = "4.5.45", features = ["derive"] }
csv = "1.3.0"
config = "0.15.14"
printpdf = { version = "0.7.0", optional = true }
calamine = "0.30.0"
rust_xlsxwriter = { version = "0.89.1", optional = true }
pulldown-cmark = "0.12.0"
moka = { version = "0.12.10", features = ["future"] }
# polars = { version = "0.44", features = ["lazy", "temporal", "json"] } # Temporarily disabled due to RUSTSEC-2025-0003 and RUSTSEC-2025-0020

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }

[features]
default = ["prometheus-metrics", "pdf-reports"]
prometheus-metrics = []
pdf-reports = ["printpdf"]
excel-reports = ["dep:rust_xlsxwriter"]
redis-cache = ["redis"]
